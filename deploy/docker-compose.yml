version: '3.9'

services:
  # ── Control Tower (이 앱) ─────────────────────────────────────────────────
  tower:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      LOG_PATH: /var/log/bukery/app.log
    ports:
      - "3000:3000"
    volumes:
      - tower-data:/app/data
      - /var/log/bukery:/var/log/bukery
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/webhook/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - n8n
    networks:
      - bukery

  # ── n8n 워크플로우 자동화 ──────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: Asia/Seoul
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - bukery

  # ── OpenClo 감시 에이전트 ──────────────────────────────────────────────────
  openclo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.openclo
    restart: unless-stopped
    environment:
      CONTROL_TOWER_URL: http://tower:3000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SERVICE_NAME: bukery-app
      LOG_PATH: /var/log/bukery/app.log
      DEPLOY_VERSION: ${DEPLOY_VERSION:-unknown}
      COMMIT_HASH: ${COMMIT_HASH:-unknown}
    volumes:
      - /var/log/bukery:/var/log/bukery:ro
    depends_on:
      - tower
    networks:
      - bukery

  # ── Nginx 리버스 프록시 ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - tower
      - n8n
    networks:
      - bukery

volumes:
  tower-data:
  n8n-data:

networks:
  bukery:
    driver: bridge
