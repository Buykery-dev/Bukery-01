version: '3.9'

services:
  # ── Control Tower ──────────────────────────────────────────────────────────
  tower:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - tower-data:/app/data
      - /var/log/bukery:/var/log/bukery
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/webhook/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bukery

  # ── OpenClo 감시 에이전트 ──────────────────────────────────────────────────
  openclo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.openclo
    restart: unless-stopped
    environment:
      CONTROL_TOWER_URL: http://tower:3000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SERVICE_NAME: bukery-app
      LOG_PATH: /var/log/bukery/app.log
      DEPLOY_VERSION: ${DEPLOY_VERSION:-unknown}
      COMMIT_HASH: ${COMMIT_HASH:-unknown}
    volumes:
      - /var/log/bukery:/var/log/bukery:ro
    depends_on:
      tower:
        condition: service_healthy
    networks:
      - bukery

  # ── Nginx 리버스 프록시 ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - tower
    networks:
      - bukery

volumes:
  tower-data:

networks:
  bukery:
    driver: bridge
