events { worker_connections 1024; }

http {
  # Control Tower webhook
  upstream tower  { server tower:3000; }
  # n8n
  upstream n8n    { server n8n:5678; }

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Control Tower (webhook 수신)
  server {
    listen 443 ssl;
    server_name ${TOWER_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${TOWER_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${TOWER_DOMAIN}/privkey.pem;

    location /webhook/ {
      proxy_pass         http://tower;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }

    location /health {
      proxy_pass http://tower/webhook/health;
    }
  }

  # n8n UI
  server {
    listen 443 ssl;
    server_name ${N8N_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${N8N_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${N8N_DOMAIN}/privkey.pem;

    location / {
      proxy_pass            http://n8n;
      proxy_set_header      Host $host;
      proxy_set_header      Upgrade $http_upgrade;
      proxy_set_header      Connection "upgrade";
      proxy_read_timeout    300s;
    }
  }
}
